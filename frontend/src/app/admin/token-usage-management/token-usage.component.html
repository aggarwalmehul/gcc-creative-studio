<div class="p-6 text-white min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Token Usage</h1>
  </div>

  <div *ngIf="isLoading" class="flex justify-center py-8">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>

  <div *ngIf="!isLoading && dataSource.data.length > 0" class="overflow-hidden rounded-lg border border-neutral-800">
    <table mat-table [dataSource]="dataSource" class="min-w-full divide-y divide-neutral-800 bg-neutral-950">

      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-neutral-400 uppercase tracking-wider">Timestamp</th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-neutral-300">{{ row.timestamp }}</td>
      </ng-container>

      <ng-container matColumnDef="platform">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-neutral-400 uppercase tracking-wider">Platform</th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-neutral-300">{{ row.platform }}</td>
      </ng-container>

      <ng-container matColumnDef="userEmail">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-neutral-400 uppercase tracking-wider">User</th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-neutral-300">{{ row.userEmail }}</td>
      </ng-container>

      <ng-container matColumnDef="model">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-neutral-400 uppercase tracking-wider">Model</th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-neutral-300">{{ row.model }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef class="px-6 py-3 text-left text-xs font-medium text-neutral-400 uppercase tracking-wider">Total Tokens</th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-neutral-300">{{ row.total }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div *ngIf="!isLoading && dataSource.data.length === 0" class="text-center py-8 text-neutral-400">
    <p>No token usage recorded in this window.</p>
  </div>
</div>
